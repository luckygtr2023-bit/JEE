name: Build Android APK

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'JEE2028TrackerAndroid/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'JEE2028TrackerAndroid/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test backend
        working-directory: JEE2028TrackerAndroid/backend
        run: npm test
      - name: Build debug APK
        working-directory: JEE2028TrackerAndroid
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jee2028-tracker-debug-apk
          path: JEE2028TrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
